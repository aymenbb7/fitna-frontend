<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background radial glow -->
    <radialGradient id="cubeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Glossy Specular overlay -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cubeDropShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="25" stdDeviation="25" flood-color="#020617" flood-opacity="0.7"/>
    </filter>
    <filter id="tileGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Tile Gradients -->
    <!-- Yellows (Top Face) -->
    <linearGradient id="tileY1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/><stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="tileY2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/><stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <!-- Whites (Top Face mixed) -->
    <linearGradient id="tileW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <!-- Reds (Left Face) -->
    <linearGradient id="tileR1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/><stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="tileR2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/><stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <!-- Oranges (Left Face mixed) -->
    <linearGradient id="tileO1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/><stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <!-- Blues (Right Face) -->
    <linearGradient id="tileB1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="tileB2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <!-- Greens (Right Face mixed) -->
    <linearGradient id="tileG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/><stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="tileG2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/><stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="400" cy="400" r="380" fill="url(#cubeGlow)"/>

  <!-- Dynamic Motion Speed Rings & Sparkles -->
  <g opacity="0.6">
    <ellipse cx="400" cy="420" rx="280" ry="140" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="16 24" transform="rotate(-15 400 420)"/>
    <ellipse cx="400" cy="420" rx="320" ry="160" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 32" transform="rotate(25 400 420)" opacity="0.4"/>
    <!-- Floating Sparkles -->
    <path d="M 640 220 Q 640 250 670 250 Q 640 250 640 280 Q 640 250 610 250 Q 640 250 640 220" fill="#FACC15" opacity="0.8"/>
    <path d="M 160 320 Q 160 340 180 340 Q 160 340 160 360 Q 160 340 140 340 Q 160 340 160 320" fill="#38BDF8" opacity="0.7"/>
    <path d="M 660 520 Q 660 535 675 535 Q 660 535 660 550 Q 660 535 645 535 Q 660 535 660 520" fill="#4ADE80" opacity="0.8"/>
  </g>

  <!-- Small Floating Cubies in Background -->
  <!-- Top Right Mini Floating Cubie -->
  <g transform="translate(630, 260) scale(0.35) rotate(25)" filter="url(#cubeDropShadow)">
    <polygon points="100,50 170,90 100,130 30,90" fill="#FACC15" stroke="#0F172A" stroke-width="6"/>
    <polygon points="30,90 100,130 100,210 30,170" fill="#EF4444" stroke="#0F172A" stroke-width="6"/>
    <polygon points="100,130 170,90 170,170 100,210" fill="#3B82F6" stroke="#0F172A" stroke-width="6"/>
  </g>
  <!-- Left Mini Floating Cubie -->
  <g transform="translate(100, 480) scale(0.28) rotate(-35)" filter="url(#cubeDropShadow)">
    <polygon points="100,50 170,90 100,130 30,90" fill="#22C55E" stroke="#0F172A" stroke-width="6"/>
    <polygon points="30,90 100,130 100,210 30,170" fill="#F97316" stroke="#0F172A" stroke-width="6"/>
    <polygon points="100,130 170,90 170,170 100,210" fill="#FFFFFF" stroke="#0F172A" stroke-width="6"/>
  </g>

  <!-- Ground Ambient Contact Shadow -->
  <ellipse cx="400" cy="650" rx="220" ry="45" fill="#020617" opacity="0.85" filter="blur(20px)"/>
  <ellipse cx="400" cy="640" rx="160" ry="25" fill="#020617" opacity="0.95" filter="blur(10px)"/>

  <!-- MAIN 3x3 RUBIK'S CUBE -->
  <!-- Isometric Center = (400, 360) -->
  <!-- dx_top = (70, 40), dy_top = (-70, 40), vertical dz = (0, 80) -->
  <g filter="url(#cubeDropShadow)">
    <!-- Black Beveled Core Structure -->
    <polygon points="400,350 622,477.5 400,605.0 178,477.5" fill="#090D16" stroke="#1E293B" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="178,477.5 400,350 400,605 178,732.5" fill="#050811" stroke="#0F172A" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="400,350 622,477.5 622,732.5 400,605" fill="#0B0F19" stroke="#1E293B" stroke-width="4" stroke-linejoin="round"/>
    <!-- TOP FACE STICKERS (Yellow / White) -->
    <polygon points="400.0,356.0 463.6,392.5 400.0,429.0 336.4,392.5" fill="url(#tileY1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="400.0,356.0 463.6,392.5 400.0,429.0 336.4,392.5" fill="url(#glossHighlight)" opacity="0.6"/>
    <polygon points="326.0,398.5 389.6,435.0 326.0,471.5 262.4,435.0" fill="url(#tileY2)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="326.0,398.5 389.6,435.0 326.0,471.5 262.4,435.0" fill="url(#glossHighlight)" opacity="0.6"/>
    <polygon points="252.0,441.0 315.6,477.5 252.0,514.0 188.4,477.5" fill="url(#tileW)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="252.0,441.0 315.6,477.5 252.0,514.0 188.4,477.5" fill="url(#glossHighlight)" opacity="0.6"/>
    <polygon points="474.0,398.5 537.6,435.0 474.0,471.5 410.4,435.0" fill="url(#tileY1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="474.0,398.5 537.6,435.0 474.0,471.5 410.4,435.0" fill="url(#glossHighlight)" opacity="0.6"/>
    <polygon points="400.0,441.0 463.6,477.5 400.0,514.0 336.4,477.5" fill="url(#tileY1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="400.0,441.0 463.6,477.5 400.0,514.0 336.4,477.5" fill="url(#glossHighlight)" opacity="0.6"/>
    <polygon points="326.0,483.5 389.6,520.0 326.0,556.5 262.4,520.0" fill="url(#tileY2)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="326.0,483.5 389.6,520.0 326.0,556.5 262.4,520.0" fill="url(#glossHighlight)" opacity="0.6"/>
    <polygon points="548.0,441.0 611.6,477.5 548.0,514.0 484.4,477.5" fill="url(#tileW)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="548.0,441.0 611.6,477.5 548.0,514.0 484.4,477.5" fill="url(#glossHighlight)" opacity="0.6"/>
    <polygon points="474.0,483.5 537.6,520.0 474.0,556.5 410.4,520.0" fill="url(#tileY2)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="474.0,483.5 537.6,520.0 474.0,556.5 410.4,520.0" fill="url(#glossHighlight)" opacity="0.6"/>
    <polygon points="400.0,526.0 463.6,562.5 400.0,599.0 336.4,562.5" fill="url(#tileY1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="400.0,526.0 463.6,562.5 400.0,599.0 336.4,562.5" fill="url(#glossHighlight)" opacity="0.6"/>
    <!-- LEFT FACE STICKERS (Red / Orange) -->
    <polygon points="331.2,395.5 394.8,358.9 394.8,432.0 331.2,468.6" fill="url(#tileR1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="331.2,395.5 394.8,358.9 394.8,432.0 331.2,468.6" fill="url(#glossHighlight)" opacity="0.25"/>
    <polygon points="331.2,480.5 394.8,443.9 394.8,517.0 331.2,553.6" fill="url(#tileO1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="331.2,480.5 394.8,443.9 394.8,517.0 331.2,553.6" fill="url(#glossHighlight)" opacity="0.25"/>
    <polygon points="331.2,565.5 394.8,528.9 394.8,602.0 331.2,638.6" fill="url(#tileR2)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="331.2,565.5 394.8,528.9 394.8,602.0 331.2,638.6" fill="url(#glossHighlight)" opacity="0.25"/>
    <polygon points="257.2,438.0 320.8,401.4 320.8,474.5 257.2,511.1" fill="url(#tileR2)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="257.2,438.0 320.8,401.4 320.8,474.5 257.2,511.1" fill="url(#glossHighlight)" opacity="0.25"/>
    <polygon points="257.2,523.0 320.8,486.4 320.8,559.5 257.2,596.1" fill="url(#tileR1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="257.2,523.0 320.8,486.4 320.8,559.5 257.2,596.1" fill="url(#glossHighlight)" opacity="0.25"/>
    <polygon points="257.2,608.0 320.8,571.4 320.8,644.5 257.2,681.1" fill="url(#tileO1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="257.2,608.0 320.8,571.4 320.8,644.5 257.2,681.1" fill="url(#glossHighlight)" opacity="0.25"/>
    <polygon points="183.2,480.5 246.8,443.9 246.8,517.0 183.2,553.6" fill="url(#tileO1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="183.2,480.5 246.8,443.9 246.8,517.0 183.2,553.6" fill="url(#glossHighlight)" opacity="0.25"/>
    <polygon points="183.2,565.5 246.8,528.9 246.8,602.0 183.2,638.6" fill="url(#tileR2)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="183.2,565.5 246.8,528.9 246.8,602.0 183.2,638.6" fill="url(#glossHighlight)" opacity="0.25"/>
    <polygon points="183.2,650.5 246.8,613.9 246.8,687.0 183.2,723.6" fill="url(#tileR1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="183.2,650.5 246.8,613.9 246.8,687.0 183.2,723.6" fill="url(#glossHighlight)" opacity="0.25"/>
    <!-- RIGHT FACE STICKERS (Royal Blue / Green) -->
    <polygon points="405.2,358.9 468.8,395.5 468.8,468.6 405.2,432.0" fill="url(#tileB1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="405.2,358.9 468.8,395.5 468.8,468.6 405.2,432.0" fill="url(#glossHighlight)" opacity="0.35"/>
    <polygon points="405.2,443.9 468.8,480.5 468.8,553.6 405.2,517.0" fill="url(#tileG1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="405.2,443.9 468.8,480.5 468.8,553.6 405.2,517.0" fill="url(#glossHighlight)" opacity="0.35"/>
    <polygon points="405.2,528.9 468.8,565.5 468.8,638.6 405.2,602.0" fill="url(#tileB2)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="405.2,528.9 468.8,565.5 468.8,638.6 405.2,602.0" fill="url(#glossHighlight)" opacity="0.35"/>
    <polygon points="479.2,401.4 542.8,438.0 542.8,511.1 479.2,474.5" fill="url(#tileG1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="479.2,401.4 542.8,438.0 542.8,511.1 479.2,474.5" fill="url(#glossHighlight)" opacity="0.35"/>
    <polygon points="479.2,486.4 542.8,523.0 542.8,596.1 479.2,559.5" fill="url(#tileB2)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="479.2,486.4 542.8,523.0 542.8,596.1 479.2,559.5" fill="url(#glossHighlight)" opacity="0.35"/>
    <polygon points="479.2,571.4 542.8,608.0 542.8,681.1 479.2,644.5" fill="url(#tileG2)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="479.2,571.4 542.8,608.0 542.8,681.1 479.2,644.5" fill="url(#glossHighlight)" opacity="0.35"/>
    <polygon points="553.2,443.9 616.8,480.5 616.8,553.6 553.2,517.0" fill="url(#tileB2)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="553.2,443.9 616.8,480.5 616.8,553.6 553.2,517.0" fill="url(#glossHighlight)" opacity="0.35"/>
    <polygon points="553.2,528.9 616.8,565.5 616.8,638.6 553.2,602.0" fill="url(#tileB1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="553.2,528.9 616.8,565.5 616.8,638.6 553.2,602.0" fill="url(#glossHighlight)" opacity="0.35"/>
    <polygon points="553.2,613.9 616.8,650.5 616.8,723.6 553.2,687.0" fill="url(#tileG1)" stroke="#050811" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="553.2,613.9 616.8,650.5 616.8,723.6 553.2,687.0" fill="url(#glossHighlight)" opacity="0.35"/>
  </g>
  <!-- Speedcube Solving Glow Elements -->
  <g transform="translate(400, 390)">
    <!-- Central dynamic highlight glint -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" opacity="0.9" filter="drop-shadow(0 0 8px #FFFFFF)"/>
  </g>
</svg>